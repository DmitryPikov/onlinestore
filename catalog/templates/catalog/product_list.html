{% extends 'catalog/home.html' %}
{% load my_tags %}
{% block content %}
<div class="row text-center">
    {% for product in object_list %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                </div>
                <div class="card-body">
                    {% if product.photo %}
                        <img src="{{ product.photo | media_filter }}" class="img-fluid" style="width: 100%; height: auto; object-fit: cover;">
                    {% endif %}
                    <h1 class="card-title pricing-card-title">{{ product.price }}</h1>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <p>{{ product.description|truncatechars:100 }}</p>
                    </ul>
                    <div class="d-flex flex-column gap-2">
                        <a type="button" class="btn btn-sm btn-outline-primary" href="{% url 'catalog:product_detail' product.pk %}">Посмотреть</a>
                        <a type="button" class="btn btn-sm btn-outline-primary" href="{% url 'catalog:product_update' product.pk %}">Редактировать</a>
                        <a type="button" class="btn btn-sm btn-danger" href="{% url 'catalog:product_delete' product.pk %}">Удалить</a>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
